<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Ablauf: Text schreiben, Blöcke prüfen, Word-Datei mit Block-Bildern erhalten">
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.4" fill="#1b1e33" fill-opacity="0.1"/>
    </pattern>
    <path id="stack" d="M0 4a4 4 0 0 1 4-4h12l8 8h16l8-8h148a4 4 0 0 1 4 4v40a4 4 0 0 1-4 4H48l-8 8H24l-8-8H4a4 4 0 0 1-4-4z"/>
    <path id="hat" d="M0 20C20-6 100-6 120 20h96a4 4 0 0 1 4 4v32a4 4 0 0 1-4 4H48l-8 8H24l-8-8H4a4 4 0 0 1-4-4z"/>
    <path id="cblock" d="M0 4a4 4 0 0 1 4-4h12l8 8h16l8-8h168a4 4 0 0 1 4 4v32a4 4 0 0 1-4 4H64l-8 8H40l-8-8H20a4 4 0 0 0-4 4v40a4 4 0 0 0 4 4h196a4 4 0 0 1 4 4v20a4 4 0 0 1-4 4H48l-8 8H24l-8-8H4a4 4 0 0 1-4-4z"/>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1l7 4-7 4" fill="none" stroke="#676e8d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <clipPath id="frame"><rect width="1200" height="420" rx="24"/></clipPath>
  </defs>

  <g clip-path="url(#frame)" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
    <rect width="1200" height="420" fill="#f3f5fb"/>
    <rect width="1200" height="420" fill="url(#dots)"/>

    <!-- 1 · Text -->
    <g transform="translate(48 48)">
      <rect width="320" height="270" rx="12" fill="#fff" stroke="#dce0ec"/>
      <path d="M0 12a12 12 0 0 1 12-12h296a12 12 0 0 1 12 12v-6H0z" fill="#5cb1d6"/>
      <rect y="0" width="320" height="6" rx="3" fill="#5cb1d6"/>
      <path d="M22 6h44l-9 8H31z" fill="#5cb1d6"/>
      <rect x="1" y="34" width="34" height="235" fill="#e9ecf6"/>
      <g font-family="'IBM Plex Mono', Menlo, monospace" font-size="15" fill="#1b1e33">
        <g fill="#676e8d" font-size="13" text-anchor="end">
          <text x="26" y="62">1</text><text x="26" y="90">2</text><text x="26" y="118">3</text><text x="26" y="146">4</text><text x="26" y="174">5</text><text x="26" y="202">6</text>
        </g>
        <text x="48" y="62">Wenn @greenFlag …</text>
        <text x="48" y="90">setze [Punkte v] auf (0)</text>
        <text x="48" y="118">wiederhole (8) mal</text>
        <text x="72" y="146">gehe (25) er Schritt</text>
        <text x="72" y="174">sage [Hallo!]</text>
        <text x="48" y="202">end</text>
      </g>
    </g>

    <!-- 2 · Blöcke -->
    <g transform="translate(440 48)">
      <rect width="320" height="270" rx="12" fill="#e9ecf6" stroke="#dce0ec"/>
      <rect width="320" height="6" rx="3" fill="#59c059"/>
      <path d="M22 6h44l-9 8H31z" fill="#59c059"/>
      <g transform="translate(40 44) scale(0.95)" stroke-width="1.5" font-size="17" font-weight="600" fill="#fff">
        <use href="#hat" fill="#ffbf00" stroke="#cc9900"/>
        <use href="#stack" y="60" fill="#ff8c1a" stroke="#db6e00"/>
        <use href="#cblock" y="108" fill="#ffab19" stroke="#cf8b17"/>
        <use href="#stack" x="16" y="148" fill="#4c97ff" stroke="#3373cc"/>
        <text x="14" y="48" stroke="none">Wenn ⚑ angeklickt</text>
        <text x="14" y="91" stroke="none">setze Punkte auf 0</text>
        <text x="14" y="139" stroke="none">wiederhole 8 mal</text>
        <text x="30" y="179" stroke="none">gehe 25 er Schritt</text>
      </g>
    </g>

    <!-- 3 · Word -->
    <g transform="translate(832 48)">
      <rect width="320" height="270" rx="12" fill="#fff" stroke="#dce0ec"/>
      <rect width="320" height="6" rx="3" fill="#ffab19"/>
      <path d="M22 6h44l-9 8H31z" fill="#ffab19"/>
      <g transform="translate(70 30)">
        <rect width="180" height="226" rx="6" fill="#fff" stroke="#b4b9d2" stroke-width="1.5"/>
        <rect x="18" y="22" width="90" height="8" rx="3" fill="#1b1e33"/>
        <rect x="18" y="42" width="144" height="5" rx="2" fill="#dce0ec"/>
        <rect x="18" y="54" width="120" height="5" rx="2" fill="#dce0ec"/>
        <g transform="translate(18 72) scale(0.42)" stroke-width="2">
          <use href="#hat" fill="#ffbf00" stroke="#cc9900"/>
          <use href="#stack" y="60" fill="#ff8c1a" stroke="#db6e00"/>
          <use href="#cblock" y="108" fill="#ffab19" stroke="#cf8b17"/>
          <use href="#stack" x="16" y="148" fill="#4c97ff" stroke="#3373cc"/>
        </g>
        <rect x="18" y="186" width="144" height="5" rx="2" fill="#dce0ec"/>
        <rect x="18" y="198" width="100" height="5" rx="2" fill="#dce0ec"/>
      </g>
    </g>

    <!-- arrows -->
    <path d="M378 183h52" stroke="#676e8d" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/>
    <path d="M770 183h52" stroke="#676e8d" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/>

    <!-- captions -->
    <g font-size="20" font-weight="700" fill="#1b1e33">
      <text x="48" y="358">1 · Text schreiben</text>
      <text x="440" y="358">2 · Blöcke prüfen</text>
      <text x="832" y="358">3 · Ergebnis nutzen</text>
    </g>
    <g font-size="15" fill="#4b5170">
      <text x="48" y="384">Deutsch oder Englisch, eine Zeile pro Block</text>
      <text x="440" y="384">Live-Vorschau, Unbekanntes wird markiert</text>
      <text x="832" y="384">SVG, PNG oder fertige .docx</text>
    </g>
  </g>
</svg>
